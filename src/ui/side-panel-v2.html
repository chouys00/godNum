<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>God Number Lookup</title>
    <link rel="stylesheet" href="side-panel.css">
  </head>
  <body>
    <main>
      <h1>God Number Lookup</h1>
      <form id="lookup-form" novalidate>
        <label for="lookup-numbers">六位數號碼（最多 10 組）</label>
        <textarea id="lookup-numbers" name="lookup-numbers" inputmode="numeric" autocomplete="off" maxlength="100" required aria-describedby="format-help" rows="5"></textarea>
        <p id="format-help">以換行、空白或逗號分隔 1 至 10 組號碼；查詢會依序進行，避免超過來源 API 的速率限制。</p>
        <button id="lookup-button" type="submit">查詢</button>
      </form>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>

      <section id="batch-results" hidden aria-labelledby="batch-results-heading">
        <h2 id="batch-results-heading">結果</h2>
        <div id="batch-result-list"></div>
      </section>
    </main>
    <script type="module" src="side-panel-v2.js"></script>
  </body>
</html>
